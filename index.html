<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MentorConnect</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f7;
      margin: 0;
      padding: 0;
    }
    .navbar {
      background: white;
      padding: 16px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .navbar h2 {
      margin: 0;
      color: #1a1a2e;
    }
    .nav-links a, .nav-links span {
      margin-left: 16px;
      color: #4f46e5;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
    }
    .nav-links a:hover {
      text-decoration: underline;
    }
    .content {
      padding: 40px;
    }
    h1 {
      text-align: center;
      color: #1a1a2e;
    }
    .mentor-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 30px;
    }
    .mentor-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      width: 260px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }
    .mentor-card img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #ddd;
      margin-bottom: 12px;
    }
    .mentor-card h3 {
      margin: 8px 0 4px;
      color: #1a1a2e;
    }
    .mentor-card p {
      color: #666;
      font-size: 14px;
      margin: 4px 0;
    }
    .book-btn {
      margin-top: 12px;
      padding: 8px 20px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .book-btn:hover {
      background: #4338ca;
    }

    .landing {
      text-align: center;
      padding: 100px 20px;
    }
    .landing h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }
    .landing p {
      color: #555;
      font-size: 18px;
      max-width: 500px;
      margin: 0 auto 30px;
    }
    .landing .cta-btn {
      padding: 14px 32px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .landing .cta-btn:hover {
      background: #4338ca;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal-box {
      background: white;
      border-radius: 12px;
      padding: 24px;
      width: 300px;
    }
    .modal-box h3 {
      margin-top: 0;
      color: #1a1a2e;
    }
    .modal-box input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .modal-box button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .modal-confirm {
      background: #4f46e5;
      color: white;
    }
    .modal-confirm:hover {
      background: #4338ca;
    }
    .modal-cancel {
      background: #eee;
      color: #333;
    }
    #modalMessage {
      text-align: center;
      font-size: 13px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <h2>MentorConnect</h2>
    <div class="nav-links" id="navLinks"></div>
  </div>

  <div class="content" id="mainContent"></div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <h3 id="modalMentorName">Book Session</h3>
      <input type="date" id="bookingDate">
     <input type="time" id="bookingTime">
      <button class="modal-confirm" onclick="confirmBooking()">Confirm Booking</button>
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
      <div id="modalMessage"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://ghmbpejvmdisssbpbcrm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_fNZHejAa5W4dxGPlyHYKBA_TCF0sOYP";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const navLinks = document.getElementById("navLinks");
    const mainContent = document.getElementById("mainContent");
    const modalOverlay = document.getElementById("modalOverlay");
    const modalMentorName = document.getElementById("modalMentorName");
    const modalMessage = document.getElementById("modalMessage");

    let selectedMentorName = "";
    let currentUserEmail = "";

    function showLandingPage() {
      mainContent.innerHTML = `
        <div class="landing">
          <h1>Find Your Mentor. Land Your Dream Job.</h1>
          <p>Connect with industry professionals for mock interviews, career advice, and real talk about what it's actually like working at top companies.</p>
          <a href="Signup.html" class="cta-btn">Get Started</a>
        </div>
      `;
    }

    async function showMentorGrid() {
      mainContent.innerHTML = `
        <h1>Find Your Mentor</h1>
        <div class="mentor-grid" id="mentorGrid">Loading mentors...</div>
      `;
      const grid = document.getElementById("mentorGrid");

      const { data, error } = await supabaseClient.from("Mentor").select("*");

      if (error) {
        grid.innerHTML = "Error loading mentors: " + error.message;
        console.error(error);
        return;
      }

      grid.innerHTML = "";
      data.forEach(mentor => {
        const card = document.createElement("div");
        card.className = "mentor-card";
        card.innerHTML = `
          <img src="https://via.placeholder.com/80" alt="${mentor.Name}">
          <h3>${mentor.Name}</h3>
          <p>${mentor.Role}</p>
          <p>${mentor.Experience}</p>
          <button class="book-btn" onclick="openModal('${mentor.Name}')">Book Session</button>
        `;
        grid.appendChild(card);
      });
    }

    function openModal(mentorName) {
      selectedMentorName = mentorName;
      modalMentorName.textContent = "Book with " + mentorName;
      modalMessage.textContent = "";
      document.getElementById("bookingDate").value = "";
      document.getElementById("bookingTime").value = "";
      modalOverlay.classList.add("open");
    }

    function closeModal() {
      modalOverlay.classList.remove("open");
    }

    async function confirmBooking() {
      const date = document.getElementById("bookingDate").value;
      const time = document.getElementById("bookingTime").value;

      if (!date || !time) {
        modalMessage.style.color = "red";
        modalMessage.textContent = "Please fill in both date and time.";
        return;
      }

      const { error } = await supabaseClient.from("Bookings").insert({
        mentor_name: selectedMentorName,
        student_email: currentUserEmail,
        booking_date: date,
        booking_time: time
      });

      if (error) {
        modalMessage.style.color = "red";
        modalMessage.textContent = "Error: " + error.message;
        console.error(error);
      } else {
        modalMessage.style.color = "green";
        modalMessage.textContent = "Booked! Closing...";
        setTimeout(closeModal, 1200);
      }
    }

    async function updateNav() {
      const { data: { session } } = await supabaseClient.auth.getSession();

      if (session) {
        currentUserEmail = session.user.email;
        navLinks.innerHTML = `
          <span>${session.user.email}</span>
          <a onclick="logOut()">Log Out</a>
        `;
        showMentorGrid();
      } else {
        navLinks.innerHTML = `
          <a href="Login.html">Sign In</a>
          <a href="Signup.html">Sign Up</a>
        `;
        showLandingPage();
      }
    }

    async function logOut() {
      await supabaseClient.auth.signOut();
      updateNav();
    }

    updateNav();
  </script>
</body>
</html>
