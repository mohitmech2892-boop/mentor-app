<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MentorConnect</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f7;
      margin: 0;
      padding: 40px;
    }
    h1 {
      text-align: center;
      color: #1a1a2e;
    }
    .mentor-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 30px;
    }
    .mentor-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      width: 260px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }
    .mentor-card img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #ddd;
      margin-bottom: 12px;
    }
    .mentor-card h3 {
      margin: 8px 0 4px;
      color: #1a1a2e;
    }
    .mentor-card p {
      color: #666;
      font-size: 14px;
      margin: 4px 0;
    }
    .book-btn {
      margin-top: 12px;
      padding: 8px 20px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .book-btn:hover {
      background: #4338ca;
    }
  </style>
</head>
<body>
  <h1>Find Your Mentor</h1>
  <div class="mentor-grid">
    <div class="mentor-card">
      <img src="https://via.placeholder.com/80" alt="Mentor">
      <h3>Priya Sharma</h3>
      <p>Software Engineer @ Google</p>
      <p>5 yrs experience</p>
      <button class="book-btn">Book Session</button>
    </div>
    <div class="mentor-card">
      <img src="https://via.placeholder.com/80" alt="Mentor">
      <h3>Rahul Mehta</h3>
      <p>Product Manager @ Amazon</p>
      <p>7 yrs experience</p>
      <button class="book-btn">Book Session</button>
    </div>
    <div class="mentor-card">
      <img src="https://via.placeholder.com/80" alt="Mentor">
      <h3>Ananya Iyer</h3>
      <p>Data Scientist @ Microsoft</p>
      <p>4 yrs experience</p>
      <button class="book-btn">Book Session</button>
    </div>
  </div>
</body>
</html>
