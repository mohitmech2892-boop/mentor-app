<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MentorConnect</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f7;
      margin: 0;
      padding: 40px;
    }
    h1 {
      text-align: center;
      color: #1a1a2e;
    }
    .mentor-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 30px;
    }
    .mentor-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      width: 260px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }
    .mentor-card img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #ddd;
      margin-bottom: 12px;
    }
    .mentor-card h3 {
      margin: 8px 0 4px;
      color: #1a1a2e;
    }
    .mentor-card p {
      color: #666;
      font-size: 14px;
      margin: 4px 0;
    }
    .book-btn {
      margin-top: 12px;
      padding: 8px 20px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .book-btn:hover {
      background: #4338ca;
    }
  </style>
</head>
<body>
  <h1>Find Your Mentor</h1>
  <div class="mentor-grid" id="mentorGrid">Loading mentors...</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://ghmbpejvmdisssbpbcrm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_fNZHejAa5W4dxGPlyHYKBA_TCF0sOYP";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const grid = document.getElementById("mentorGrid");

    async function loadMentors() {
      const { data, error } = await supabaseClient.from("Mentor").select("*");

      if (error) {
        grid.innerHTML = "Error loading mentors: " + error.message;
        console.error(error);
        return;
      }

      grid.innerHTML = "";
      data.forEach(mentor => {
        const card = document.createElement("div");
        card.className = "mentor-card";
        card.innerHTML = `
          <img src="https://via.placeholder.com/80" alt="${mentor.Name}">
          <h3>${mentor.Name}</h3>
          <p>${mentor.Role}</p>
          <p>${mentor.Experience}</p>
          <button class="book-btn">Book Session</button>
        `;
        grid.appendChild(card);
      });
    }

    loadMentors();
  </script>
</body>
</html>
